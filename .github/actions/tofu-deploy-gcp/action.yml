name: Tofu deploy (GCP)
description: >-
  Authenticates to GCP via OIDC (no stored keys), then runs
  `tofu init/plan/apply` against infra/environments/<environment>/gcp --
  a dedicated Tofu root with its own state file, entirely separate from
  Azure's. This action has no Azure touchpoint at all: not the provider,
  not auth, not state. Composite actions can't read the `vars`/`secrets`
  contexts themselves (only normal job steps and reusable-workflow-call
  jobs can), so this needs its GitHub Environment's Variables handed to it
  explicitly by the caller.

inputs:
  environment:
    description: "sandbox | prod -- selects infra/environments/<environment>/gcp and its state prefix."
    required: true
  gcp_project_id:
    required: true
  gcp_wif_provider:
    required: true
  gcp_deploy_service_account:
    required: true
  tofu_state_bucket:
    required: true
  gcp_dashboard_image:
    required: true
  gcp_agent_image:
    required: true

runs:
  using: composite
  steps:
    - name: Auth to GCP (Workload Identity Federation)
      uses: google-github-actions/auth@v3
      with:
        project_id: ${{ inputs.gcp_project_id }}
        workload_identity_provider: ${{ inputs.gcp_wif_provider }}
        service_account: ${{ inputs.gcp_deploy_service_account }}

    - name: Install OpenTofu
      uses: opentofu/setup-opentofu@v2
      with:
        tofu_version: "1.12.6"

    - name: tofu init
      shell: bash
      working-directory: infra/environments/${{ inputs.environment }}/gcp
      run: |
        tofu init -input=false \
          -backend-config="bucket=${{ inputs.tofu_state_bucket }}" \
          -backend-config="prefix=${{ inputs.environment }}/gcp"

    - name: tofu plan
      shell: bash
      working-directory: infra/environments/${{ inputs.environment }}/gcp
      # For log visibility only -- see tofu apply below for why this
      # doesn't save/reuse a plan file.
      run: |
        tofu plan -input=false -lock-timeout=300s \
          -var="gcp_dashboard_image=${{ inputs.gcp_dashboard_image }}" \
          -var="gcp_agent_image=${{ inputs.gcp_agent_image }}"

    - name: tofu apply
      shell: bash
      working-directory: infra/environments/${{ inputs.environment }}/gcp
      # No -out/apply-from-file: this root's state is now independent of
      # Azure's, so the original "saved plan goes stale while waiting on
      # the other cloud's lock" problem this pattern fixed no longer
      # applies here -- but a concurrent second run of this SAME workflow
      # (e.g. two people triggering it close together) could still race,
      # so keep computing a fresh plan inside apply rather than reusing
      # one from before the wait.
      run: |
        tofu apply -input=false -lock-timeout=300s -auto-approve \
          -var="gcp_dashboard_image=${{ inputs.gcp_dashboard_image }}" \
          -var="gcp_agent_image=${{ inputs.gcp_agent_image }}"
