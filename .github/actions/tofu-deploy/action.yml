name: Tofu deploy
description: >-
  Authenticates to GCP and Azure via OIDC (no stored keys) using the calling
  job's GitHub Environment, then runs `tofu init/plan/apply` against
  infra/environments/<environment>. Self-contained so any workflow can call
  it, not just this repo's deploy.yml -- reads its cloud/backend config from
  that Environment's own Variables (GCP_PROJECT_ID, GCP_WIF_PROVIDER,
  GCP_DEPLOY_SERVICE_ACCOUNT, AZURE_SUBSCRIPTION_ID, AZURE_TENANT_ID,
  AZURE_CLIENT_ID, TOFU_STATE_BUCKET) rather than taking them as inputs.

inputs:
  environment:
    description: "sandbox | prod -- selects infra/environments/<environment> and the state file prefix."
    required: true
  gcp_dashboard_image:
    required: true
  gcp_agent_image:
    required: true
  azure_dashboard_image:
    required: true
  azure_agent_image:
    required: true

runs:
  using: composite
  steps:
    - name: Auth to GCP (Workload Identity Federation)
      uses: google-github-actions/auth@v2
      with:
        project_id: ${{ vars.GCP_PROJECT_ID }}
        workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
        service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}

    - name: Auth to Azure (federated credential)
      uses: azure/login@v2
      with:
        client-id: ${{ vars.AZURE_CLIENT_ID }}
        tenant-id: ${{ vars.AZURE_TENANT_ID }}
        subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

    - name: Install OpenTofu
      uses: opentofu/setup-opentofu@v1
      with:
        tofu_version: "1.12.6"

    - name: tofu init
      shell: bash
      working-directory: infra/environments/${{ inputs.environment }}
      run: |
        tofu init -input=false \
          -backend-config="bucket=${{ vars.TOFU_STATE_BUCKET }}" \
          -backend-config="prefix=${{ inputs.environment }}"

    - name: tofu plan
      shell: bash
      working-directory: infra/environments/${{ inputs.environment }}
      run: |
        tofu plan -input=false -out=tfplan \
          -var="gcp_dashboard_image=${{ inputs.gcp_dashboard_image }}" \
          -var="gcp_agent_image=${{ inputs.gcp_agent_image }}" \
          -var="azure_dashboard_image=${{ inputs.azure_dashboard_image }}" \
          -var="azure_agent_image=${{ inputs.azure_agent_image }}"

    - name: tofu apply
      shell: bash
      working-directory: infra/environments/${{ inputs.environment }}
      run: tofu apply -input=false -auto-approve tfplan
