name: Tofu deploy
description: >-
  Authenticates to GCP (and, unless cloud=gcp, Azure) via OIDC (no stored
  keys), then runs `tofu init/plan/apply` against
  infra/environments/<environment>. GCP auth is always required even for an
  azure-only run, since Tofu's state backend itself lives in a GCS bucket.
  Composite actions can't read the `vars`/`secrets` contexts directly (only
  normal job steps and reusable-workflow-call jobs can) -- unlike a
  workflow, this action needs its GitHub Environment's Variables handed to
  it explicitly by the caller.

inputs:
  environment:
    description: "sandbox | prod -- selects infra/environments/<environment> and the state file prefix."
    required: true
  cloud:
    description: "both | gcp | azure -- which cloud's module to plan/apply (-target); both means the whole config."
    required: false
    default: "both"
  gcp_project_id:
    required: true
  gcp_wif_provider:
    required: true
  gcp_deploy_service_account:
    required: true
  azure_client_id:
    required: true
  azure_tenant_id:
    required: true
  azure_subscription_id:
    required: true
  tofu_state_bucket:
    required: true
  gcp_dashboard_image:
    required: false
    default: ""
  gcp_agent_image:
    required: false
    default: ""
  azure_dashboard_image:
    required: false
    default: ""
  azure_agent_image:
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Auth to GCP (Workload Identity Federation)
      uses: google-github-actions/auth@v2
      with:
        project_id: ${{ inputs.gcp_project_id }}
        workload_identity_provider: ${{ inputs.gcp_wif_provider }}
        service_account: ${{ inputs.gcp_deploy_service_account }}

    - name: Auth to Azure (federated credential)
      if: inputs.cloud != 'gcp'
      uses: azure/login@v2
      with:
        client-id: ${{ inputs.azure_client_id }}
        tenant-id: ${{ inputs.azure_tenant_id }}
        subscription-id: ${{ inputs.azure_subscription_id }}

    - name: Install OpenTofu
      uses: opentofu/setup-opentofu@v1
      with:
        tofu_version: "1.12.6"

    - name: tofu init
      shell: bash
      working-directory: infra/environments/${{ inputs.environment }}
      run: |
        tofu init -input=false \
          -backend-config="bucket=${{ inputs.tofu_state_bucket }}" \
          -backend-config="prefix=${{ inputs.environment }}"

    - name: tofu plan
      shell: bash
      working-directory: infra/environments/${{ inputs.environment }}
      run: |
        TARGET_ARGS=()
        case "${{ inputs.cloud }}" in
          gcp) TARGET_ARGS=(-target=module.gcp) ;;
          azure) TARGET_ARGS=(-target=module.azure) ;;
        esac
        tofu plan -input=false -out=tfplan "${TARGET_ARGS[@]}" \
          -var="gcp_dashboard_image=${{ inputs.gcp_dashboard_image }}" \
          -var="gcp_agent_image=${{ inputs.gcp_agent_image }}" \
          -var="azure_dashboard_image=${{ inputs.azure_dashboard_image }}" \
          -var="azure_agent_image=${{ inputs.azure_agent_image }}"

    - name: tofu apply
      shell: bash
      working-directory: infra/environments/${{ inputs.environment }}
      run: tofu apply -input=false -auto-approve tfplan
