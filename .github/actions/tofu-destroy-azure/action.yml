name: Tofu destroy (Azure)
description: >-
  Destroys every Azure resource this Tofu root manages -- the resource
  group and everything in it (Cosmos DB, Key Vault, Container Registry,
  Container Apps environment/jobs/dashboard, Log Analytics, the managed
  identities) -- EXCEPT the GitHub OIDC app registration/service
  principal/federated credential (-exclude below), so the exact same
  workflow credentials still AUTHENTICATE afterward.

  Unlike GCP's equivalent, that's as far as it goes: github_deployer's
  only Azure RBAC grants (Contributor on the resource group, AcrPush on
  the registry) are scoped to resources THIS destroy removes, so once it
  finishes, github_deployer can log in but can do nothing else at all --
  not even create a replacement resource group. Re-running deploy-
  azure.yml afterward WILL fail on the very first `tofu apply`, the same
  way the original bootstrap did (infra/README.md's "Bootstrap order"):
  someone with real subscription permissions needs to create a fresh
  resource group and grant github_deployer Contributor on it (step 3/4 of
  that section) before Tofu can do anything again. This is a property of
  the ABAC-constrained Owner account documented there, not something this
  action can route around -- confirmed by reading the actual resource
  graph: there is no Azure RBAC grant to github_deployer that survives
  its resource group's deletion.

  SECOND thing confirmed the hard way (a real run against sandbox,
  2026-10-02): every azurerm_role_assignment this module manages ALSO
  needs excluding, for a completely different reason than the identity
  objects above -- Azure's built-in Contributor role, by design, excludes
  Microsoft.Authorization/roleAssignments/delete, so github_deployer
  can't delete role assignments even ones scoped to resources it CAN
  fully destroy otherwise. Without this exclude, the real run failed
  there with nine 403s and never even reached the resource group, Key
  Vault, registry or managed identities -- Tofu aborts a destroy at the
  first failed resource in dependency order, so those nine role
  assignments being un-deletable blocked everything that depends on them
  too. Once the resource group itself is destroyed, Azure cascades away
  every role assignment scoped inside it on its own -- confirmed directly
  against the Azure API after a manual cleanup -- so excluding them here
  just stops Tofu from attempting (and failing at) a delete Azure was
  always going to do for it anyway; the final step below syncs Tofu's own
  state to match that reality afterward, so a future `tofu plan` doesn't
  show phantom resources Tofu thinks still exist.

inputs:
  environment:
    description: "sandbox | prod -- selects infra/environments/<environment>/azure and its state key."
    required: true
  azure_client_id:
    required: true
  azure_tenant_id:
    required: true
  azure_subscription_id:
    required: true
  tofu_state_resource_group:
    description: "Resource group holding the Azure Storage account used for Tofu state (not the environment's own resource group -- that one IS destroyed)."
    required: true
  tofu_state_storage_account:
    required: true
  tofu_state_container:
    required: true

runs:
  using: composite
  steps:
    - name: Auth to Azure (federated credential)
      uses: azure/login@v3
      with:
        client-id: ${{ inputs.azure_client_id }}
        tenant-id: ${{ inputs.azure_tenant_id }}
        subscription-id: ${{ inputs.azure_subscription_id }}

    - name: Install OpenTofu
      uses: opentofu/setup-opentofu@v2
      with:
        tofu_version: "1.12.6"

    - name: tofu init
      shell: bash
      working-directory: infra/environments/${{ inputs.environment }}/azure
      run: |
        tofu init -input=false \
          -backend-config="resource_group_name=${{ inputs.tofu_state_resource_group }}" \
          -backend-config="storage_account_name=${{ inputs.tofu_state_storage_account }}" \
          -backend-config="container_name=${{ inputs.tofu_state_container }}" \
          -backend-config="key=${{ inputs.environment }}.tfstate"

    # Shared by plan/destroy/the post-destroy state cleanup below, so the
    # three can never drift apart from each other. Space-joined on ONE
    # line, not one -exclude per line: this gets interpolated directly
    # into later steps' `run:` command lines, where a literal embedded
    # newline would silently split it into separate, broken shell
    # commands instead of one command's worth of flags.
    - name: Compute exclude flags
      id: excludes
      shell: bash
      run: |
        flags="-exclude=module.azure.azuread_application.github_deployer"
        flags="$flags -exclude=module.azure.azuread_service_principal.github_deployer"
        flags="$flags -exclude=module.azure.azuread_application_federated_identity_credential.github"
        flags="$flags -exclude=module.azure.azurerm_role_assignment.agent_acr_pull"
        flags="$flags -exclude=module.azure.azurerm_role_assignment.agent_kv_read"
        flags="$flags -exclude=module.azure.azurerm_role_assignment.dashboard_acr_pull"
        flags="$flags -exclude=module.azure.azurerm_role_assignment.dashboard_container_apps"
        flags="$flags -exclude=module.azure.azurerm_role_assignment.dashboard_container_apps_jobs"
        flags="$flags -exclude=module.azure.azurerm_role_assignment.dashboard_kv_admin"
        flags="$flags -exclude=module.azure.azurerm_role_assignment.github_deployer_acr_push"
        flags="$flags -exclude=module.azure.azurerm_role_assignment.github_deployer_kv_admin"
        flags="$flags -exclude=module.azure.azurerm_role_assignment.github_deployer_rg"
        echo "flags=$flags" >> "$GITHUB_OUTPUT"

    - name: tofu plan -destroy
      shell: bash
      working-directory: infra/environments/${{ inputs.environment }}/azure
      # For log visibility before the real thing -- see tofu destroy
      # below for why this doesn't save/reuse a plan file.
      run: |
        tofu plan -destroy -input=false -lock-timeout=300s \
          ${{ steps.excludes.outputs.flags }}

    - name: tofu destroy
      shell: bash
      working-directory: infra/environments/${{ inputs.environment }}/azure
      run: |
        tofu destroy -input=false -lock-timeout=300s -auto-approve \
          ${{ steps.excludes.outputs.flags }}

    - name: Sync state for the role assignments Azure already removed
      shell: bash
      working-directory: infra/environments/${{ inputs.environment }}/azure
      # Only reached if the destroy step above succeeded -- if it failed,
      # the resource group (and therefore its cascade-deletion of these
      # role assignments) may not have actually happened, and blindly
      # removing these from state then would orphan real resources from
      # Tofu's tracking instead of just correcting stale bookkeeping.
      # `|| true` per removal: a role assignment that's somehow already
      # gone from state (e.g. a partial prior run already cleaned it up)
      # must not fail this step.
      run: |
        for addr in \
          "module.azure.azurerm_role_assignment.agent_acr_pull" \
          "module.azure.azurerm_role_assignment.agent_kv_read" \
          "module.azure.azurerm_role_assignment.dashboard_acr_pull" \
          "module.azure.azurerm_role_assignment.dashboard_container_apps" \
          "module.azure.azurerm_role_assignment.dashboard_container_apps_jobs" \
          "module.azure.azurerm_role_assignment.dashboard_kv_admin" \
          "module.azure.azurerm_role_assignment.github_deployer_acr_push" \
          "module.azure.azurerm_role_assignment.github_deployer_kv_admin" \
          "module.azure.azurerm_role_assignment.github_deployer_rg" \
        ; do
          tofu state rm "$addr" || true
        done
