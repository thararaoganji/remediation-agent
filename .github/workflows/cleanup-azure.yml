# Manual-trigger-only: prunes old images from Azure Container Registry.
name: Cleanup (Azure Registry)

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Which environment(s) to clean up"
        required: true
        type: choice
        options:
          - sb
          - sandbox
          - prod
          - both
        default: sb
      keep_count:
        description: "How many most-recent image tags per repo to keep, beyond whatever's currently deployed"
        required: true
        default: "5"

jobs:
  cleanup-sb:
    if: inputs.environment == 'sb'
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/reusable-cleanup-azure.yml
    with:
      environment: sb
      keep_count: ${{ inputs.keep_count }}

  cleanup-sandbox:
    if: inputs.environment == 'both' || inputs.environment == 'sandbox'
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/reusable-cleanup-azure.yml
    with:
      environment: sandbox
      keep_count: ${{ inputs.keep_count }}

  cleanup-prod:
    if: inputs.environment == 'both' || inputs.environment == 'prod'
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/reusable-cleanup-azure.yml
    with:
      environment: prod
      keep_count: ${{ inputs.keep_count }}
