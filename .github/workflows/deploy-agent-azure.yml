# Manual-trigger-only: deploys the Remediation Agents to Azure.
# Supports selecting sb, sandbox, prod, or both environments.
name: Deploy Agent (Azure)

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Which environment(s) to deploy"
        required: true
        type: choice
        options:
          - sb
          - sandbox
          - prod
          - both
        default: sb

jobs:
  deploy-sb:
    if: inputs.environment == 'sb'
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/reusable-deploy-agent-azure.yml
    with:
      environment: sb

  deploy-sandbox:
    if: inputs.environment == 'both' || inputs.environment == 'sandbox'
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/reusable-deploy-agent-azure.yml
    with:
      environment: sandbox

  deploy-prod:
    needs: deploy-sandbox
    if: |
      always() &&
      (needs.deploy-sandbox.result == 'success' || needs.deploy-sandbox.result == 'skipped') &&
      (inputs.environment == 'both' || inputs.environment == 'prod')
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/reusable-deploy-agent-azure.yml
    with:
      environment: prod
