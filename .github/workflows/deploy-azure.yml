# Manual-trigger-only: nothing deploys automatically on push, for either
# environment. Run this from the Actions tab and pick which environment(s)
# to deploy. prod additionally requires explicitly selecting "prod" or
# "both" -- picking "sandbox" (the default) never touches prod.
#
# GitHub's required-reviewer environment protection rules need GitHub
# Pro/Team on a private repo, which this account doesn't have, so there's
# no second approval click enforced on top of triggering this by hand --
# that manual trigger is the actual gate today.
#
# Azure-only: calls reusable-deploy-azure.yml, which has no GCP deployment
# steps (it does still authenticate to GCP once, since Tofu's state
# backend lives in a GCS bucket regardless of which cloud is being
# touched). See deploy-gcp.yml for GCP's identical structure.
name: Deploy (Azure)

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Which environment(s) to deploy"
        required: true
        type: choice
        options:
          - both
          - sandbox
          - prod
        default: sandbox

jobs:
  deploy-sandbox:
    if: inputs.environment == 'both' || inputs.environment == 'sandbox'
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/reusable-deploy-azure.yml
    with:
      environment: sandbox

  deploy-prod:
    needs: deploy-sandbox
    if: |
      always() &&
      (needs.deploy-sandbox.result == 'success' || needs.deploy-sandbox.result == 'skipped') &&
      (inputs.environment == 'both' || inputs.environment == 'prod')
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/reusable-deploy-azure.yml
    with:
      environment: prod
