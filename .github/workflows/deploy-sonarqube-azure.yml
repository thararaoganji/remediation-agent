# Provisions and manages a SonarQube Community Build VM on Azure.
# Uses mc1arke/sonarqube-with-community-branch-plugin so that agent runs land
# on a distinct, per-run branch server-side rather than always reporting against
# "main".
#
# Supported actions:
#   - deploy:  Provisions the VM, installs Docker, configures sysctl limits
#              (vm.max_map_count), and runs SonarQube + Postgres via Compose.
#   - start:   Powers on an existing deallocated VM.
#   - stop:    Deallocates the VM to save compute costs when not in use.
#   - destroy: Deletes the SonarQube resource group.
#
# Authentication is keyless via Azure OIDC federated credentials (azure/login@v3).
name: SonarQube (Azure VM)

on:
  workflow_dispatch:
    inputs:
      action:
        description: "Action to perform"
        required: true
        type: choice
        options:
          - deploy
          - start
          - stop
          - destroy
        default: deploy
      environment:
        description: "Target environment (sandbox or prod)"
        required: true
        type: choice
        options:
          - sandbox
          - prod
        default: sandbox
      vm_size:
        description: "Azure VM size (Standard_B2ms provides 2 vCPUs, 8GB RAM)"
        required: true
        default: "Standard_B2ms"
      allowed_ip:
        description: "Client IP CIDR allowed to reach port 9000 (e.g. 203.0.113.10/32, or '*' for any)"
        required: false
        default: "*"

permissions:
  contents: read
  id-token: write

jobs:
  manage-sonarqube:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Authenticate to Azure (federated credential)
        uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Set environment variables
        run: |
          echo "RESOURCE_GROUP=sonarqube-${{ inputs.environment }}-rg" >> "$GITHUB_ENV"
          echo "VM_NAME=sonarqube-${{ inputs.environment }}-vm" >> "$GITHUB_ENV"
          echo "LOCATION=${{ vars.AZURE_LOCATION || 'eastus' }}" >> "$GITHUB_ENV"

      # --- DESTROY ACTION ---
      - name: Destroy SonarQube Resource Group
        if: inputs.action == 'destroy'
        run: |
          echo "Deleting resource group $RESOURCE_GROUP..."
          az group delete --name "$RESOURCE_GROUP" --yes --no-wait

      # --- STOP (DEALLOCATE) ACTION ---
      - name: Stop (Deallocate) VM
        if: inputs.action == 'stop'
        run: |
          echo "Deallocating VM $VM_NAME..."
          az vm deallocate --resource-group "$RESOURCE_GROUP" --name "$VM_NAME"

      # --- START ACTION ---
      - name: Start VM
        if: inputs.action == 'start'
        run: |
          echo "Starting VM $VM_NAME..."
          az vm start --resource-group "$RESOURCE_GROUP" --name "$VM_NAME"
          IP=$(az vm show -d -g "$RESOURCE_GROUP" -n "$VM_NAME" --query publicIps -o tsv)
          echo "SonarQube is accessible at: http://${IP}:9000"

      # --- DEPLOY / PROVISION ACTION ---
      - name: Provision VM and Security Groups
        if: inputs.action == 'deploy'
        run: |
          az group create --name "$RESOURCE_GROUP" --location "$LOCATION"

          if ! az vm show -g "$RESOURCE_GROUP" -n "$VM_NAME" &>/dev/null; then
            echo "Creating VM $VM_NAME..."
            az vm create \
              --resource-group "$RESOURCE_GROUP" \
              --name "$VM_NAME" \
              --image "Canonical:0001-com-ubuntu-server-jammy:22_04-lts-gen2:latest" \
              --size "${{ inputs.vm_size }}" \
              --admin-username "azureuser" \
              --generate-ssh-keys \
              --public-ip-sku Standard
          else
            echo "VM $VM_NAME already exists."
          fi

          # Allow inbound port 9000 for SonarQube
          az network nsg rule create \
            --resource-group "$RESOURCE_GROUP" \
            --nsg-name "${VM_NAME}NSG" \
            --name "AllowSonarQube9000" \
            --priority 1000 \
            --source-address-prefixes "${{ inputs.allowed_ip }}" \
            --destination-port-ranges 9000 \
            --access Allow \
            --protocol Tcp || true

      - name: Configure VM and Start SonarQube via Azure Run-Command
        if: inputs.action == 'deploy'
        run: |
          cat <<'EOF' > /tmp/setup_sonarqube.sh
          #!/usr/bin/env bash
          set -euo pipefail

          # 1. Host settings for Elasticsearch
          echo "vm.max_map_count=262144" | tee -a /etc/sysctl.conf
          echo "fs.file-max=131072" | tee -a /etc/sysctl.conf
          sysctl -p

          # 2. Install Docker and Compose plugin if not present
          if ! command -v docker &>/dev/null; then
            apt-get update
            apt-get install -y ca-certificates curl gnupg
            install -m 0755 -d /etc/apt/keyrings
            curl -fsSL https://download.docker.com/linux/ubuntu/gpg -o /etc/apt/keyrings/docker.asc
            chmod a+r /etc/apt/keyrings/docker.asc

            echo \
              "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/ubuntu \
              $(. /etc/os-release && echo "$VERSION_CODENAME") stable" | \
              tee /etc/apt/sources.list.d/docker.list > /dev/null

            apt-get update
            apt-get install -y docker-ce docker-ce-cli containerd.io docker-compose-plugin
            systemctl enable --now docker
          fi

          # 3. Setup SonarQube Docker Compose
          mkdir -p /opt/sonarqube
          cd /opt/sonarqube

          cat <<'COMPOSE' > docker-compose.yml
          version: "3.8"
          services:
            sonarqube:
              image: mc1arke/sonarqube-with-community-branch-plugin:latest
              depends_on:
                - db
              environment:
                SONAR_JDBC_URL: jdbc:postgresql://db:5432/sonar
                SONAR_JDBC_USERNAME: sonar
                SONAR_JDBC_PASSWORD: ${SONAR_DB_PASSWORD:-sonarpass}
                SONAR_SEARCH_JAVAOPTS: "-Xmx1024m -Xms1024m"
                SONAR_WEB_JAVAOPTS: "-Xmx1024m -Xms512m"
                SONAR_CE_JAVAOPTS: "-Xmx1024m -Xms512m"
              ports:
                - "9000:9000"
              volumes:
                - sonarqube_data:/opt/sonarqube/data
                - sonarqube_extensions:/opt/sonarqube/extensions
                - sonarqube_logs:/opt/sonarqube/logs
              ulimits:
                nofile:
                  soft: 65536
                  hard: 65536
                nproc: 4096
              restart: unless-stopped

            db:
              image: postgres:16
              environment:
                POSTGRES_USER: sonar
                POSTGRES_PASSWORD: ${SONAR_DB_PASSWORD:-sonarpass}
                POSTGRES_DB: sonar
              volumes:
                - postgresql_data:/var/lib/postgresql/data
              restart: unless-stopped

          volumes:
            sonarqube_data:
            sonarqube_extensions:
            sonarqube_logs:
            postgresql_data:
          COMPOSE

          docker compose up -d
          EOF

          az vm run-command invoke \
            --resource-group "$RESOURCE_GROUP" \
            --name "$VM_NAME" \
            --command-id RunShellScript \
            --scripts @/tmp/setup_sonarqube.sh

          VM_IP=$(az vm show -d -g "$RESOURCE_GROUP" -n "$VM_NAME" --query publicIps -o tsv)
          echo "=========================================================="
          echo "SonarQube deployed successfully."
          echo "Web URL: http://${VM_IP}:9000"
          echo "Default credentials: admin / admin"
          echo "=========================================================="
