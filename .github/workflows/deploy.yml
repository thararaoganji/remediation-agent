# Single entrypoint for deploying both the dashboard and the agents, to both
# clouds, for both environments. Supersedes the old deploy-gcp.yml (agent-only,
# GCP-only, no Tofu) now that infra/ manages everything via OpenTofu -- see
# infra/README.md.
#
# A push to main always runs both, sandbox then prod (prod still pauses for
# its GitHub Environment's required-reviewer approval -- that gate lives in
# the repo's Environment settings, not in this file). A manual run
# (workflow_dispatch) lets you instead pick just one environment from the
# dropdown, e.g. to redeploy prod alone after approving it, or to re-push
# sandbox alone without waiting on prod's gate.
name: Deploy

on:
  push:
    branches: [main]
    paths:
      - "agent_techdebt/**"
      - "agent_coverage/**"
      - "agent_duplicate/**"
      - "sonar/**"
      - "core/**"
      - "run_local.py"
      - "requirements.txt"
      - "Dockerfile"
      - "dashboard/**"
      - "infra/**"
      - ".github/workflows/deploy.yml"
      - ".github/workflows/reusable-tofu-deploy.yml"
      - ".github/actions/tofu-deploy/**"
  workflow_dispatch:
    inputs:
      environment:
        description: "Which environment(s) to deploy"
        required: true
        type: choice
        options:
          - both
          - sandbox
          - prod
        default: both

jobs:
  deploy-sandbox:
    if: github.event_name == 'push' || inputs.environment == 'both' || inputs.environment == 'sandbox'
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/reusable-tofu-deploy.yml
    with:
      environment: sandbox

  deploy-prod:
    needs: deploy-sandbox
    if: |
      always() &&
      (needs.deploy-sandbox.result == 'success' || needs.deploy-sandbox.result == 'skipped') &&
      (github.event_name == 'push' || inputs.environment == 'both' || inputs.environment == 'prod')
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/reusable-tofu-deploy.yml
    with:
      environment: prod
