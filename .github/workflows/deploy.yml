# Single entrypoint for deploying both the dashboard and the agents, to both
# clouds, for both environments. Supersedes the old deploy-gcp.yml (agent-only,
# GCP-only, no Tofu) now that infra/ manages everything via OpenTofu -- see
# infra/README.md.
#
# A push to main always runs both environments and both clouds, sandbox
# then prod (prod still pauses for its GitHub Environment's
# required-reviewer approval -- that gate lives in the repo's Environment
# settings, not in this file). A manual run (workflow_dispatch) lets you
# instead pick just one environment and/or just one cloud from the
# dropdowns, e.g. to redeploy prod alone after approving it, to re-push
# sandbox alone without waiting on prod's gate, or to push only to Azure
# while GCP is untouched.
name: Deploy

on:
  push:
    branches: [main]
    paths:
      - "agent_techdebt/**"
      - "agent_coverage/**"
      - "agent_duplicate/**"
      - "sonar/**"
      - "core/**"
      - "run_local.py"
      - "requirements.txt"
      - "Dockerfile"
      - "dashboard/**"
      - "infra/**"
      - ".github/workflows/deploy.yml"
      - ".github/workflows/reusable-tofu-deploy.yml"
      - ".github/actions/tofu-deploy/**"
  workflow_dispatch:
    inputs:
      environment:
        description: "Which environment(s) to deploy"
        required: true
        type: choice
        options:
          - both
          - sandbox
          - prod
        default: sandbox
      cloud:
        description: "Which cloud(s) to deploy"
        required: true
        type: choice
        options:
          - both
          - gcp
          - azure
        default: both

jobs:
  deploy-sandbox:
    if: github.event_name == 'push' || inputs.environment == 'both' || inputs.environment == 'sandbox'
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/reusable-tofu-deploy.yml
    with:
      environment: sandbox
      cloud: ${{ inputs.cloud || 'both' }}

  deploy-prod:
    needs: deploy-sandbox
    if: |
      always() &&
      (needs.deploy-sandbox.result == 'success' || needs.deploy-sandbox.result == 'skipped') &&
      (github.event_name == 'push' || inputs.environment == 'both' || inputs.environment == 'prod')
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/reusable-tofu-deploy.yml
    with:
      environment: prod
      cloud: ${{ inputs.cloud || 'both' }}
