# Manual-trigger-only, sandbox-only + typed-confirmation safety gates.
#
# Destroys all GCP sandbox resources (Cloud Run service + jobs, Firestore,
# Secret Manager secrets, Artifact Registry) EXCEPT the Workload Identity
# Federation scaffolding and GitHub deployer service account/IAM roles.
#
# Re-running deployment afterward succeeds with NO manual bootstrap steps.
name: Destroy (GCP sandbox)

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "destroy-sandbox" to confirm -- this deletes real running GCP infrastructure.'
        required: true

jobs:
  check-confirmation:
    runs-on: ubuntu-latest
    steps:
      - name: Verify confirmation phrase
        run: |
          if [ "${{ inputs.confirm }}" != "destroy-sandbox" ]; then
            echo "::error::Confirmation phrase did not match 'destroy-sandbox' -- aborting without touching anything."
            exit 1
          fi

  destroy-sandbox:
    needs: check-confirmation
    runs-on: ubuntu-latest
    environment: sandbox
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v5

      - name: Auth to GCP (Workload Identity Federation)
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}

      - name: Install OpenTofu
        uses: opentofu/setup-opentofu@v2
        with:
          tofu_version: "1.12.6"

      - name: tofu init
        shell: bash
        working-directory: infra/environments/sandbox/gcp
        run: |
          tofu init -input=false \
            -backend-config="bucket=${{ vars.TOFU_STATE_BUCKET }}" \
            -backend-config="prefix=sandbox/gcp"

      - name: tofu plan -destroy
        shell: bash
        working-directory: infra/environments/sandbox/gcp
        run: |
          tofu plan -destroy -input=false -lock-timeout=300s \
            -exclude="module.gcp.google_iam_workload_identity_pool.github" \
            -exclude="module.gcp.google_iam_workload_identity_pool_provider.github" \
            -exclude="module.gcp.google_service_account.github_deployer" \
            -exclude="module.gcp.google_project_iam_member.github_deployer_roles" \
            -exclude="module.gcp.google_service_account_iam_member.github_deployer_wif"

      - name: tofu destroy
        shell: bash
        working-directory: infra/environments/sandbox/gcp
        run: |
          tofu destroy -input=false -lock-timeout=300s -auto-approve \
            -exclude="module.gcp.google_iam_workload_identity_pool.github" \
            -exclude="module.gcp.google_iam_workload_identity_pool_provider.github" \
            -exclude="module.gcp.google_service_account.github_deployer" \
            -exclude="module.gcp.google_project_iam_member.github_deployer_roles" \
            -exclude="module.gcp.google_service_account_iam_member.github_deployer_wif"
