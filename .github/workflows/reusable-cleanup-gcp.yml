# Reusable workflow to purge old images from GCP Artifact Registry,
# keeping the currently deployed tag plus the N most recent tags.
name: Reusable - Cleanup GCP Registry

on:
  workflow_call:
    inputs:
      environment:
        description: "sandbox | prod"
        required: true
        type: string
      keep_count:
        required: true
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    steps:
      - uses: actions/checkout@v5

      - name: Auth to GCP (Workload Identity Federation)
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v3

      - name: Purge old images, keeping what's deployed + the N most recent
        shell: bash
        env:
          PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          REGION: ${{ vars.GCP_REGION }}
          KEEP_COUNT: ${{ inputs.keep_count }}
        run: |
          set -euo pipefail

          REPO_BASE="${REGION}-docker.pkg.dev/${PROJECT_ID}/sonar-remediation-repo"

          echo "Reading currently-deployed image digests..."
          deployed_images=()
          dashboard_image=$(gcloud run services describe sonar-dashboard --project "$PROJECT_ID" --region "$REGION" \
            --format="value(spec.template.spec.containers[0].image)" 2>/dev/null || echo "")
          [ -n "$dashboard_image" ] && deployed_images+=("$dashboard_image")
          for job in techdebt coverage duplicate; do
            job_image=$(gcloud run jobs describe "sonar-remediation-${job}-job" --project "$PROJECT_ID" --region "$REGION" \
              --format="value(spec.template.spec.template.spec.containers[0].image)" 2>/dev/null || echo "")
            [ -n "$job_image" ] && deployed_images+=("$job_image")
          done
          echo "Currently deployed image(s): ${deployed_images[*]:-none found}"

          total_deleted=0
          for image_name in sonar-dashboard sonar-remediation-agent; do
            echo ""
            echo "=== $image_name ==="
            package="${REPO_BASE}/${image_name}"

            all_digests=$(gcloud artifacts docker images list "$package" \
              --include-tags --sort-by="~CREATE_TIME" \
              --format="csv[no-heading](version,tags)" 2>/dev/null || echo "")
            if [ -z "$all_digests" ]; then
              echo "No images found, skipping."
              continue
            fi
            recent_digests=$(echo "$all_digests" | head -n "$KEEP_COUNT" | cut -d, -f1)

            deleted_this_image=0
            line_num=0
            while IFS=, read -r digest tags; do
              [ -z "$digest" ] && continue
              line_num=$((line_num + 1))
              full_ref="${package}@${digest}"
              keep=false
              for d in "${deployed_images[@]:-}"; do
                [[ "$d" == *"$digest"* ]] && keep=true && break
                [[ ",$tags," == *",${d##*:},"* ]] && keep=true && break
              done
              if echo "$recent_digests" | grep -qx "$digest"; then
                keep=true
              fi
              if [ "$keep" = true ]; then
                continue
              fi
              echo "Deleting $full_ref (tags: ${tags:-none})"
              gcloud artifacts docker images delete "$full_ref" --project "$PROJECT_ID" --quiet --delete-tags
              deleted_this_image=$((deleted_this_image + 1))
            done <<< "$all_digests"
            echo "$image_name: deleted $deleted_this_image image(s)"
            total_deleted=$((total_deleted + deleted_this_image))
          done

          echo ""
          echo "Total images deleted: $total_deleted"
