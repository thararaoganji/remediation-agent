# Reusable workflow to build and deploy the Remediation Agents to GCP.
# Builds the agent image, queries GCP for the currently-deployed dashboard image
# (so the dashboard is unaffected), and runs OpenTofu to update the Cloud Run Jobs.
name: Reusable - Deploy Agent GCP

on:
  workflow_call:
    inputs:
      environment:
        description: "sandbox | prod"
        required: true
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    steps:
      - uses: actions/checkout@v5

      - name: Auth to GCP (Workload Identity Federation)
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v3

      - name: Configure Docker for GCP Artifact Registry
        run: gcloud auth configure-docker "${{ vars.GCP_REGION }}-docker.pkg.dev" --quiet

      - name: Build and push agent image
        id: image
        run: |
          SHA="${{ github.sha }}"
          REPO="${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/sonar-remediation-repo"
          AGENT_IMG="${REPO}/sonar-remediation-agent:${SHA}"
          echo "tag=${AGENT_IMG}" >> "$GITHUB_OUTPUT"

          docker build -f Dockerfile -t "${AGENT_IMG}" .
          docker push "${AGENT_IMG}"

      - name: Resolve live dashboard image
        id: live-dashboard
        run: |
          REPO="${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/sonar-remediation-repo"
          DEFAULT_DASHBOARD="${REPO}/sonar-dashboard:latest"

          LIVE_DASHBOARD=$(gcloud run services describe "sonar-dashboard" \
            --project "${{ vars.GCP_PROJECT_ID }}" \
            --region "${{ vars.GCP_REGION }}" \
            --format="value(spec.template.spec.containers[0].image)" 2>/dev/null || echo "")

          if [ -n "$LIVE_DASHBOARD" ]; then
            echo "Resolved live dashboard image: $LIVE_DASHBOARD"
            echo "image=${LIVE_DASHBOARD}" >> "$GITHUB_OUTPUT"
          else
            echo "No live dashboard service found; falling back to default: $DEFAULT_DASHBOARD"
            echo "image=${DEFAULT_DASHBOARD}" >> "$GITHUB_OUTPUT"
          fi

      - name: Install OpenTofu
        uses: opentofu/setup-opentofu@v2
        with:
          tofu_version: "1.12.6"

      - name: tofu init
        shell: bash
        working-directory: infra/environments/${{ inputs.environment }}/gcp
        run: |
          tofu init -input=false \
            -backend-config="bucket=${{ vars.TOFU_STATE_BUCKET }}" \
            -backend-config="prefix=${{ inputs.environment }}/gcp"

      - name: tofu plan
        shell: bash
        working-directory: infra/environments/${{ inputs.environment }}/gcp
        run: |
          tofu plan -input=false -lock-timeout=300s \
            -var="gcp_dashboard_image=${{ steps.live-dashboard.outputs.image }}" \
            -var="gcp_agent_image=${{ steps.image.outputs.tag }}"

      - name: tofu apply
        shell: bash
        working-directory: infra/environments/${{ inputs.environment }}/gcp
        run: |
          tofu apply -input=false -lock-timeout=300s -auto-approve \
            -var="gcp_dashboard_image=${{ steps.live-dashboard.outputs.image }}" \
            -var="gcp_agent_image=${{ steps.image.outputs.tag }}"
