# Builds the dashboard and agent images, pushes both to Azure Container
# Registry tagged with the git SHA, then hands those image refs to the
# tofu-deploy-azure composite action (infra/environments/<env>/azure --
# its own Tofu root with its own state file, in Azure Storage). This
# job's own `environment:` (set from the `environment` input below,
# sandbox or prod) is what makes `vars.*` resolve to that environment's
# own project/registry/etc. It has to live here rather than on the caller
# job in deploy-azure.yml -- GitHub's schema for a job that calls a
# reusable workflow via `uses:` doesn't accept `environment:` alongside
# it.
#
# Fully Azure-only, deliberately: no GCP auth, no GCP image build/push, no
# GCP state, no GCP anything. This used to still need GCP credentials
# purely because Tofu's state lived in a shared GCS bucket -- now that
# Azure's state has its own Storage Account, that dependency is gone
# entirely, and the two clouds' deploys share nothing. See
# reusable-deploy-gcp.yml for GCP's mirror-image equivalent.
name: Reusable - Deploy Azure

on:
  workflow_call:
    inputs:
      environment:
        description: "sandbox | prod"
        required: true
        type: string

permissions:
  contents: read
  id-token: write # required for keyless auth via Azure's federated credential

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    steps:
      - uses: actions/checkout@v5

      - name: Auth to Azure (federated credential)
        uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Log in to Azure Container Registry
        run: az acr login --name "${{ vars.AZURE_ACR_NAME }}"

      - name: Set image tags
        id: images
        run: |
          SHA="${{ github.sha }}"
          REPO="${{ vars.AZURE_ACR_NAME }}.azurecr.io"
          {
            echo "dashboard=${REPO}/sonar-dashboard:${SHA}"
            echo "agent=${REPO}/sonar-remediation-agent:${SHA}"
          } >> "$GITHUB_OUTPUT"

      - name: Build and push agent image
        run: |
          docker build -f Dockerfile -t "${{ steps.images.outputs.agent }}" .
          docker push "${{ steps.images.outputs.agent }}"

      - name: Build and push dashboard image
        run: |
          docker build -f dashboard/Dockerfile -t "${{ steps.images.outputs.dashboard }}" .
          docker push "${{ steps.images.outputs.dashboard }}"

      - name: Deploy with OpenTofu
        uses: ./.github/actions/tofu-deploy-azure
        with:
          environment: ${{ inputs.environment }}
          # Composite actions can't read `vars`/`secrets` themselves -- only
          # this job (a normal reusable-workflow-call job) can, so they're
          # passed through explicitly.
          azure_client_id: ${{ vars.AZURE_CLIENT_ID }}
          azure_tenant_id: ${{ vars.AZURE_TENANT_ID }}
          azure_subscription_id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
          tofu_state_resource_group: ${{ vars.TOFU_STATE_AZURE_RESOURCE_GROUP }}
          tofu_state_storage_account: ${{ vars.TOFU_STATE_AZURE_STORAGE_ACCOUNT }}
          tofu_state_container: ${{ vars.TOFU_STATE_AZURE_CONTAINER }}
          azure_dashboard_image: ${{ steps.images.outputs.dashboard }}
          azure_agent_image: ${{ steps.images.outputs.agent }}
