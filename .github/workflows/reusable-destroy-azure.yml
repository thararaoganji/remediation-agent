# Thin wrapper around tofu-destroy-azure -- same reusable-workflow-for-
# `environment:` reasoning as reusable-deploy-azure.yml.
name: Reusable - Destroy Azure

on:
  workflow_call:
    inputs:
      environment:
        description: "sandbox | prod"
        required: true
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  destroy:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    steps:
      - uses: actions/checkout@v5

      - uses: ./.github/actions/tofu-destroy-azure
        with:
          environment: ${{ inputs.environment }}
          azure_client_id: ${{ vars.AZURE_CLIENT_ID }}
          azure_tenant_id: ${{ vars.AZURE_TENANT_ID }}
          azure_subscription_id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
          tofu_state_resource_group: ${{ vars.TOFU_STATE_AZURE_RESOURCE_GROUP }}
          tofu_state_storage_account: ${{ vars.TOFU_STATE_AZURE_STORAGE_ACCOUNT }}
          tofu_state_container: ${{ vars.TOFU_STATE_AZURE_CONTAINER }}
