# Fully-local stack: dashboard + agents + a local NoSQL database, no GCP or
# Azure account needed at all. CLOUD_PROVIDER=local picks storage_local.py/
# secrets_local.py/job_runner_local.py/event_stream_local.py (dashboard) and
# core/tools/run_status_local.py (agent) -- MongoDB stands in for
# Firestore/Cosmos DB, and job_runner_local.py starts each run as a real
# sibling container via the host's Docker socket (see its own docstring for
# why that needs /var/run/docker.sock mounted into `backend`, not a nested
# Docker daemon).
#
# Usage:
#   docker compose build          # builds the agent image job_runner_local.py starts on demand
#   docker compose up             # starts mongo + backend + frontend
#   docker compose exec backend python create_admin.py --email you@example.com --password 'a-real-password'
#   open http://localhost:5180
#
# See dashboard/README.md for the full walkthrough.

services:
  mongo:
    image: mongo:7
    volumes:
      - mongo-data:/data/db
    ports:
      - "27017:27017"
    networks:
      - local-net
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 10

  # This block exists purely so `docker compose build` produces the
  # sonar-remediation-agent-local:latest image job_runner_local.py starts
  # fresh sibling containers from on every run -- it's never meant to run
  # as a standing container itself (no .env, no RUN_ID, nothing run_local
  # .py needs). `profiles:` is required for that, not just leaving off
  # `depends_on`: confirmed the hard way -- plain `docker compose up`
  # starts EVERY service with no profile by default regardless of whether
  # anything depends on it, so without this it started right alongside
  # mongo/backend/frontend and immediately crash-looped on run_local.py's
  # own "Missing required .env keys" check. A profile nobody passes with
  # `--profile` keeps `docker compose up`/`up -d` from ever starting it,
  # while `docker compose build` (no profile filtering) still builds it.
  agent:
    profiles: ["build-only"]
    build:
      context: .
      dockerfile: Dockerfile
    image: sonar-remediation-agent-local:latest
    # Without this, `docker compose run agent` lands on an isolated
    # per-run network with no route to `mongo` at all -- confirmed the
    # hard way (a plain `getent hosts mongo` inside the container failed
    # outright) while wiring up core/tools/local_secrets.py, which needs
    # to actually reach Mongo for CLOUD_PROVIDER=local +
    # SONAR_SERVER_NAME-based runs. job_runner_local.py's sibling
    # containers don't need this -- they're attached to DOCKER_NETWORK
    # explicitly via the Docker SDK, bypassing this service definition
    # entirely -- but a direct `docker compose run agent` does.
    networks:
      - local-net

  backend:
    image: python:3.12-slim
    working_dir: /app
    volumes:
      - ./dashboard/backend:/app
      # "Docker outside of Docker": lets this container ask the HOST's
      # real Docker daemon to start a sibling agent container, rather than
      # running a nested daemon inside it -- see job_runner_local.py.
      - /var/run/docker.sock:/var/run/docker.sock
    command: sh -c "pip install --no-cache-dir -r requirements.txt && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    ports:
      - "8010:8000"
    environment:
      CLOUD_PROVIDER: local
      MONGO_URL: mongodb://mongo:27017
      MONGO_DB: dashboard
      # Local dev only -- fine to be static and committed here. Never reuse
      # this for anything that isn't this docker-compose stack.
      SESSION_SECRET_KEY: local-dev-only-not-a-real-secret-do-not-reuse
      # Encrypts every Sonar token/GitHub PAT/LLM key at rest in the
      # `_secrets` collection (secrets_local.py) -- same "fine as a
      # committed placeholder, override for anything you'd mind someone
      # else reading off disk" deal as SESSION_SECRET_KEY above. Changing
      # this after secrets already exist makes them permanently
      # undecryptable under the new value -- re-add them via the
      # Connections page rather than expecting an in-place migration.
      LOCAL_SECRETS_ENCRYPTION_KEY: local-dev-only-not-a-real-key-do-not-reuse
      AGENT_IMAGE: sonar-remediation-agent-local:latest
      DOCKER_NETWORK: sonar-remediation-local
    depends_on:
      mongo:
        condition: service_healthy
    networks:
      - local-net

  frontend:
    image: node:20-slim
    working_dir: /app
    volumes:
      - ./dashboard/frontend:/app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    ports:
      - "5180:5173"
    environment:
      # vite.config.js reads this to proxy /api/* at the backend
      # CONTAINER's hostname instead of localhost:8000 (the default for
      # the non-Docker dev workflow in dashboard/README.md).
      VITE_API_PROXY_TARGET: http://backend:8000
    depends_on:
      - backend
    networks:
      - local-net

volumes:
  mongo-data:

networks:
  # Named explicitly (not left to compose's project-name-prefixed default)
  # so job_runner_local.py's DOCKER_NETWORK default matches it exactly --
  # the sibling containers it starts via the host's Docker socket need
  # this exact name to land on the same network as `mongo`.
  local-net:
    name: sonar-remediation-local
